<!doctype html>
<!-- kt_poster.html: BOLD POSTER. One family (Archivo variable: wght 100-900, wdth 62-125), caps, paper / ink / ONE loud accent.
     Scenes and words come from tl.json (tl.py TYPE["kt"] + COPY); colour fields are drawn by edit.py from tl.FIELDS.
     Render: python3 lib/render_html.py ui/kt_poster.html --dur <LEN> --out frames/kt_poster --jobs 1 -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="/lib/kt.css">
<style>
@font-face{font-family:'Archivo';src:url('/fonts/archivo-latin-wdth-normal.woff2') format('woff2');font-style:normal;font-weight:100 900;font-stretch:62% 125%;font-display:block}
@font-face{font-family:'Archivo';src:url('/fonts/archivo-latin-wdth-italic.woff2') format('woff2');font-style:italic;font-weight:100 900;font-stretch:62% 125%;font-display:block}
.d{font-family:'Archivo';font-weight:900;font-variation-settings:"wght" 900,"wdth" 100;text-transform:uppercase;letter-spacing:-.01em}
.s{font-family:'Archivo';font-weight:700;font-variation-settings:"wght" 700,"wdth" 100;text-transform:uppercase}
.m{font-family:'Archivo';font-weight:800;font-variation-settings:"wght" 800,"wdth" 75;text-transform:uppercase}
.it{font-family:'Archivo';font-style:italic;font-weight:900;font-variation-settings:"wght" 900,"wdth" 125}
.board{font-family:'Archivo';font-weight:800;font-variation-settings:"wght" 800,"wdth" 80;font-variant-numeric:tabular-nums}
</style></head><body><div id="stage"></div>
<script src="/lib/kit.js"></script><script src="/lib/ktkit.js"></script>
<script>
KT.boot({ fonts: ['900 100px Archivo', 'italic 900 100px Archivo', '700 100px Archivo'], axes: { wdth: [62, 125] } });
</script></body></html>
