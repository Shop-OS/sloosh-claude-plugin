<!doctype html>
<!-- kt_swiss.html: SWISS CLEAN. Inter Tight 800 sentence case (tracking -0.045em) + JetBrains Mono labels + one Instrument Serif
     italic accent word. Bone field with two soft hazes (tl.HAZES), four landing-flash accents, split-flap board, kinetic grid,
     list finale. Render: python3 lib/render_html.py ui/kt_swiss.html --dur <LEN> --out frames/kt_swiss --jobs 1 -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="/lib/kt.css">
<style>
@font-face{font-family:'Inter Tight';src:url('/fonts/inter-tight-latin-wght-normal.woff2') format('woff2');font-weight:100 900;font-display:block}
@font-face{font-family:'JetBrains Mono';src:url('/fonts/jetbrains-mono-latin-wght-normal.woff2') format('woff2');font-weight:100 800;font-display:block}
@font-face{font-family:'Instrument Serif';src:url('/fonts/instrument-serif-latin-400-italic.woff2') format('woff2');font-style:italic;font-weight:400;font-display:block}
.d{font-family:'Inter Tight';font-weight:800;letter-spacing:-.045em}
.s,.m{font-family:'JetBrains Mono';font-weight:500;letter-spacing:-.01em}
.s.kick{letter-spacing:.14em;padding-left:.14em}
.it{font-family:'Instrument Serif';font-style:italic;font-weight:400;letter-spacing:-.02em}
.board{font-family:'JetBrains Mono';font-weight:700}
.kt-line .w.it{font-size:1.08em}
</style></head><body><div id="stage"></div>
<script src="/lib/kit.js"></script><script src="/lib/ktkit.js"></script>
<script>
KT.boot({ fonts: ['800 100px "Inter Tight"', '500 100px "JetBrains Mono"', '700 100px "JetBrains Mono"', 'italic 400 100px "Instrument Serif"'] });
</script></body></html>
