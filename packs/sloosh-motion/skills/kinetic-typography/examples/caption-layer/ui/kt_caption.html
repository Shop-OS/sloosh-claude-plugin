<!doctype html>
<!-- kt_caption.html: the CAPTION / TYPE LAYER over any other style's footage. Director hype family (Archivo italic, wdth 125, wght 900)
     for slams and lockups + Instrument Serif italic for the breath word. Transparent; soft dark shadow; vertical-feed safe zone and rail.
     Reads only TYPE["kt"] + COPY, so it never clashes with the director ui/type.html keys.
     Render: python3 lib/render_html.py ui/kt_caption.html --dur <LEN> --out frames/kt_caption --jobs 1 -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="/lib/kt.css">
<style>
@font-face{font-family:'Archivo';src:url('/fonts/archivo-latin-wdth-italic.woff2') format('woff2');font-style:italic;font-weight:100 900;font-stretch:62% 125%;font-display:block}
@font-face{font-family:'Instrument Serif';src:url('/fonts/instrument-serif-latin-400-italic.woff2') format('woff2');font-style:italic;font-weight:400;font-display:block}
.d{font-family:'Archivo';font-style:italic;font-weight:900;font-variation-settings:"wght" 900,"wdth" 125;text-transform:uppercase;letter-spacing:-.01em}
.s{font-family:'Archivo';font-style:italic;font-weight:700;font-variation-settings:"wght" 700,"wdth" 100;text-transform:uppercase}
.it,.serif{font-family:'Instrument Serif';font-style:italic;font-weight:400;text-transform:none}
</style></head><body><div id="stage"></div>
<script src="/lib/kit.js"></script><script src="/lib/ktkit.js"></script>
<script>
KT.boot({ fonts: ['italic 900 100px Archivo', 'italic 400 100px "Instrument Serif"'], caption: true });
</script></body></html>
