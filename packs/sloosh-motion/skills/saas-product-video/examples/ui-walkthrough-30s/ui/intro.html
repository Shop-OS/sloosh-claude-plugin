<!doctype html>
<!-- ui/intro.html (saas-product-video): the gradient intro (natural 4.0 s), opaque.
       python3 lib/render_html.py ui/intro.html --dur 4 --jobs 1 --out frames/intro
     0.00-1.50  a pastel brand gradient over a blurred portrait (the approved desk still); the editorial line
                "Imagine a whole / creative team" blurs in word by word, each word shifting from the accent to ink
     1.50-2.50  bracketed words: "{ in one app }" (1.60-2.62), the brackets slide apart to the MEASURED width as each word lands
     2.50-3.88  "intro·ducing" splits open at the dot; generated thumbnails flicker inside the gap, then a push-in
     Copy from tl.json COPY.intro; images from plates/. Nothing here is generated by a model. -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Inter Tight';src:url('/fonts/inter-tight-latin-wght-normal.woff2') format('woff2');font-weight:100 900;font-display:block}
@font-face{font-family:'Instrument Serif';src:url('/fonts/instrument-serif-latin-400-italic.woff2') format('woff2');font-style:italic;font-weight:400;font-display:block}
html,body{margin:0;overflow:hidden;background:#FFF3EC}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#FFF3EC}
#bg,#portrait,#cam{position:absolute;inset:0}
#portrait{background-size:cover;background-position:center;filter:blur(36px) saturate(1.2);opacity:.32}
.sans{font-family:'Inter Tight';font-weight:600;letter-spacing:-.035em;color:#1A1714;white-space:nowrap}
.serif{font-family:'Instrument Serif';font-style:italic;font-weight:400;letter-spacing:-.01em;white-space:nowrap}
.line{position:absolute;left:0;right:0;text-align:center;line-height:1.02}
.w{display:inline-block;margin:0 .12em}
#br{position:absolute;left:0;top:0}
#br .b{position:absolute;font-family:'Inter Tight';font-weight:200;color:#1A1714}
#br .bw{position:absolute;white-space:nowrap}
#split{position:absolute;left:0;top:0;width:100%}
#split .h{position:absolute;white-space:nowrap}
#gap{position:absolute;overflow:hidden;border-radius:18px;box-shadow:0 30px 60px rgba(60,20,0,.25)}
#gap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
</style></head><body><div id="stage"><div id="bg"></div><div id="portrait"></div><div id="cam"></div></div>
<script src="/lib/kit.js"></script>
<script>
(async () => {
  const TL = await loadTL(), W = TL.W, H = TL.H, C = TL.COPY.intro, A = TL.ACCENT, A2 = TL.ACCENT2;
  await Promise.all(['600 100px "Inter Tight"', '200 100px "Inter Tight"', 'italic 400 100px "Instrument Serif"'].map(f => document.fonts.load(f)));
  const IMGS = ['/plates/world.jpg', '/plates/ref1.jpg', '/plates/desk.jpg', '/plates/ref2.jpg', '/plates/phone.jpg'];   // REPLACE: the product's real outputs
  await Promise.all(IMGS.map(s => new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = s; })));
  const st = document.getElementById('stage'), cam = document.getElementById('cam'), bg = document.getElementById('bg');
  st.style.width = W + 'px'; st.style.height = H + 'px';
  document.getElementById('portrait').style.backgroundImage = `url(${IMGS[2]})`;
  const fmt = W / H > 1.2 ? 'land' : W / H < 0.85 ? 'port' : 'square';
  const P = { land: { sans: 92, serif: 112, br: 170, bw: 124, split: 230 }, port: { sans: 80, serif: 98, br: 150, bw: 104, split: 172 },
              square: { sans: 72, serif: 88, br: 140, bw: 96, split: 160 } }[fmt];
  const SW = W - 2 * (fmt === 'land' ? 104 : fmt === 'port' ? 120 : 72);
  const add = (html) => { const d = document.createElement('div'); d.innerHTML = html; const e = d.firstElementChild; cam.appendChild(e); return e; };

  // 1 · editorial line: sans words, then the serif italic phrase in the accent
  const words = (s, cls, size) => s.split(' ').map(w => `<span class="w ${cls}" style="font-size:${size}px">${w}</span>`).join('');
  const l1 = add(`<div class="line"><span class="in" style="display:inline-block">${words(C[0], 'sans', P.sans)}</span></div>`), l2 = add(`<div class="line"><span class="in" style="display:inline-block">${words(C[1], 'serif', P.serif)}</span></div>`);
  [l1, l2].forEach(l => { const inr = l.querySelector('.in'), w = K.measure(inr).width; if (w > SW) inr.querySelectorAll('.w').forEach(e => e.style.fontSize = (parseFloat(e.style.fontSize) * SW / w) + 'px'); });
  l1.style.top = (H * 0.5 - K.measure(l1).height) + 'px'; l2.style.top = (H * 0.5) + 'px';
  const ws = [...l1.querySelectorAll('.w'), ...l2.querySelectorAll('.w')];

  // 2 · bracket build: { in one app }
  const br = add(`<div id="br"><span class="b bl" style="font-size:${P.br}px">{</span><span class="b brr" style="font-size:${P.br}px">}</span></div>`);
  const bws = C[2].split(' ').map(w => { const s = document.createElement('span'); s.className = 'bw serif'; s.style.fontSize = P.bw + 'px'; s.style.color = A; s.textContent = w; br.appendChild(s); return s; });
  const gapW = P.bw * 0.28, bwW = bws.map(s => K.measure(s).width), totW = bwW.reduce((a, b) => a + b, 0) + gapW * (bws.length - 1);
  const bl = br.querySelector('.bl'), brr = br.querySelector('.brr'), bH = K.measure(bl).height, bwH = K.measure(bws[0]).height, bW = K.measure(bl).width;
  let x = (W - totW) / 2; const bx = bws.map((s, i) => { const v = x; x += bwW[i] + gapW; return v; });
  bws.forEach((s, i) => { s.style.left = bx[i] + 'px'; s.style.top = (H / 2 - bwH / 2) + 'px'; });
  [bl, brr].forEach(b => b.style.top = (H / 2 - bH / 2 - P.br * 0.06) + 'px');
  // the brackets' open position after k words have landed (measured, never guessed)
  const openAt = k => { if (k <= 0) return [W / 2 - bW - 6, W / 2 + 6];
    const L = bx[0], R = bx[k - 1] + bwW[k - 1]; const c = (L + R) / 2, half = (R - L) / 2 + P.br * 0.16; return [c - half - bW, c + half]; };

  // 3 · intro·ducing splits open; thumbnails flicker in the gap
  const [h1, h2] = C[3].split('·');
  const sp = add(`<div id="split"><span class="h serif h1" style="font-size:${P.split}px;color:#1A1714">${h1}</span><span class="h serif dot" style="font-size:${P.split}px;color:${A}">·</span><span class="h serif h2" style="font-size:${P.split}px;color:#1A1714">${h2}</span><div id="gap"><img></div></div>`);
  const e1 = sp.querySelector('.h1'), e2 = sp.querySelector('.h2'), dot = sp.querySelector('.dot'), gap = sp.querySelector('#gap'), gimg = gap.querySelector('img');
  let w1 = K.measure(e1).width, w2 = K.measure(e2).width, wd = K.measure(dot).width;
  if (w1 + w2 + wd > SW) { const s = SW / (w1 + w2 + wd); [e1, e2, dot].forEach(e => e.style.fontSize = (P.split * s) + 'px'); w1 *= s; w2 *= s; wd *= s; }
  const sh = K.measure(e1).height, GW = Math.min(W * 0.28, 600) , GH = GW * 1.25 * (fmt === 'land' ? 0.62 : 0.8);
  [e1, e2, dot].forEach(e => e.style.top = (H / 2 - sh / 2) + 'px');
  Object.assign(gap.style, { width: GW + 'px', height: GH + 'px', top: (H / 2 - GH / 2) + 'px', left: (W / 2 - GW / 2) + 'px' });

  window.render = t => {
    // background: three brand-tint blobs drifting (radial gradients, never filter:blur on big layers)
    const d = t * 0.25;
    bg.style.background = `radial-gradient(60% 70% at ${30 + 18 * Math.sin(d * 2)}% ${40 + 10 * Math.cos(d * 3)}%, ${A2}88, transparent 70%),` +
      `radial-gradient(55% 60% at ${75 - 15 * Math.sin(d * 2.4)}% ${65 + 12 * Math.sin(d * 1.7)}%, ${A}55, transparent 70%),` +
      `radial-gradient(50% 50% at ${55 + 20 * Math.cos(d * 1.3)}% ${15 + 8 * Math.sin(d)}%, #E9D9FFcc, transparent 70%), #FFF3EC`;
    K.set('#portrait', { s: 1.1 + 0.04 * t });
    // 1 · words blur in one by one (blur 14 -> 0, y 22 -> 0), sans words shift accent -> ink
    const out1 = K.E.in(K.seg(t, 1.38, 1.62));
    ws.forEach((w, i) => { const a = 0.12 + i * 0.13, u = K.E.out(K.seg(t, a, a + 0.42));
      K.set(w, { o: u * (1 - out1), y: (1 - u) * 22 - out1 * 40, blur: (1 - u) * 14 + out1 * 8 });
      if (w.classList.contains('sans')) { const c = K.seg(t, a + 0.1, a + 0.7); w.style.color = c < 1 ? mix(A, '#1A1714', c) : '#1A1714'; } else w.style.color = A; });
    // 2 · brackets: appear together, open to fit each word as it lands
    const bOn = t >= 1.6 && t < 2.62; br.style.display = bOn ? '' : 'none';
    if (bOn) {
      const land = bws.map((_, i) => 1.75 + i * 0.2), k = land.filter(a => t >= a).length;
      const [pl, pr] = openAt(k - 1), [ql, qr] = openAt(k), u = k ? K.E.back(K.seg(t, land[k - 1], land[k - 1] + 0.22), 1.3) : 0;
      const fade = 1 - K.seg(t, 2.45, 2.6), bin = K.E.out(K.seg(t, 1.6, 1.78));
      K.set(bl, { x: K.lerp(pl, ql, u), o: bin * fade, s: 0.7 + 0.3 * bin }); K.set(brr, { x: K.lerp(pr, qr, u) - 0, o: bin * fade, s: 0.7 + 0.3 * bin });
      bws.forEach((s, i) => { const v = K.E.out(K.seg(t, land[i] + 0.02, land[i] + 0.3)); K.set(s, { o: v * fade, y: (1 - v) * 30, blur: (1 - v) * 12 }); });
      bl.style.left = '0px'; brr.style.left = '0px';
    }
    // 3 · intro·ducing: in, split open at 2.95, thumbnails flicker every 2 frames, push-in at the end
    const sOn = t >= 2.5; sp.style.display = sOn ? '' : 'none';
    if (sOn) {
      const vin = K.E.out(K.seg(t, 2.5, 2.8)), op = K.E.inOut(K.seg(t, 2.95, 3.35)), half = op * (GW / 2 + P.split * 0.12);
      const cx = W / 2, x1 = cx - wd / 2 - w1, x2 = cx + wd / 2;
      K.set(e1, { x: x1 - half, o: vin, blur: (1 - vin) * 10 }); K.set(e2, { x: x2 + half, o: vin, blur: (1 - vin) * 10 });
      K.set(dot, { x: cx - wd / 2, o: vin * (1 - K.seg(t, 2.95, 3.1)) });
      const g = K.seg(t, 3.0, 3.35); K.set(gap, { o: g > 0 ? 1 : 0, sx: Math.max(0.01, K.E.out(g)), s: 1 });
      const fr = Math.floor(t * TL.FPS / 2), pick = t < 3.62 ? fr % IMGS.length : 0;
      if (gimg.dataset.k != pick) { gimg.src = IMGS[pick]; gimg.dataset.k = pick; }
      K.set(cam, { s: 1 + 0.18 * K.E.in(K.seg(t, 3.55, 3.88)), origin: '50% 50%', blur: 6 * K.E.in(K.seg(t, 3.7, 3.88)) });
    } else K.set(cam, { s: 1 });
  };
  function mix(a, b, u) { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const x = p(a), y = p(b); return `rgb(${x.map((v, i) => Math.round(v + (y[i] - v) * u)).join(',')})`; }
  await document.fonts.ready; window.READY = true;
})();
</script></body></html>
