<!doctype html>
<!-- ui/build.html (saas-product-video): the results build (natural 4.0 s), opaque, the film's one DARK beat.
       python3 lib/render_html.py ui/build.html --dur 4 --jobs 1 --out frames/build
     0.00-1.40  thermal reveal: the hero result in a thermal colour filter (SVG colour matrix + transfer table, slow hue
                drift), wiped away left to right by a moving gradient mask with a glowing scan line
     1.40-2.60  build steps: the hero slides left, a steps card shows 3 steps; each label shimmers, then ticks done
                (tick times = tl.json BUILD_CUES.steps, so audio.py puts a pop on each)
     2.60-4.00  a cascade of 12 generated 4:5 posts drops into a grid; "Example output" label
     The images are the product's REAL outputs (or the approved AI stills). Never present a mock-up as a real result. -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Inter Tight';src:url('/fonts/inter-tight-latin-wght-normal.woff2') format('woff2');font-weight:100 900;font-display:block}
html,body{margin:0;overflow:hidden;background:#0E0C0B}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:radial-gradient(70% 60% at 50% 110%,#3A1A0E,#0E0C0B 70%);font-family:'Inter Tight';color:#fff}
#hero{position:absolute;border-radius:22px;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08)}
#hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#scan{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px}
#steps{position:absolute;border-radius:24px;background:rgba(255,255,255,.06);box-shadow:0 0 0 1px rgba(255,255,255,.1),0 30px 80px rgba(0,0,0,.5);backdrop-filter:blur(2px)}
.stp{display:flex;align-items:center;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.ic{flex:none;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center}
.ic svg{position:absolute;inset:0}
.lb{background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.tile{position:absolute;border-radius:16px;overflow:hidden;box-shadow:0 24px 50px rgba(0,0,0,.55);transform-origin:50% 50%}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .cap{position:absolute;left:8%;right:8%;bottom:7%;height:14%;border-radius:10px;background:rgba(0,0,0,.45)}
.tile .cap i{position:absolute;left:8%;height:16%;border-radius:4px;background:rgba(255,255,255,.75)}
.tile .lg{position:absolute;left:7%;top:6%;width:13%;aspect-ratio:1;border-radius:30%;background:url(/ui/logo.svg) center/cover}
#ex{position:absolute;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.55)}
</style></head><body><div id="stage">
<svg width="0" height="0" style="position:absolute"><filter id="thermal" color-interpolation-filters="sRGB">
  <feColorMatrix type="saturate" values="0"/>
  <feComponentTransfer><feFuncR type="table" tableValues="0.02 0.25 0.85 1 1"/><feFuncG type="table" tableValues="0 0.02 0.15 0.65 1"/><feFuncB type="table" tableValues="0.25 0.75 0.35 0.05 0.75"/></feComponentTransfer>
  <feColorMatrix id="hue" type="hueRotate" values="0"/></filter></svg>
<div id="hero"><img src="/plates/world.jpg"><img id="therm" src="/plates/world.jpg" style="filter:url(#thermal)"><div id="scan"></div></div>
<div id="steps"></div><div id="tiles"></div><div id="ex">Example output</div>
</div>
<script src="/lib/kit.js"></script>
<script>
(async () => {
  const TL = await loadTL(), W = TL.W, H = TL.H, A = TL.ACCENT, A2 = TL.ACCENT2, BC = TL.BUILD_CUES, STEPS = TL.COPY.steps;
  const IMGS = ['/plates/world.jpg', '/plates/ref1.jpg', '/plates/desk.jpg', '/plates/ref2.jpg', '/plates/phone.jpg'];   // REPLACE: the real outputs
  await document.fonts.load('600 40px "Inter Tight"');
  const $ = s => document.querySelector(s), st = $('#stage'); st.style.width = W + 'px'; st.style.height = H + 'px';
  const fmt = W / H > 1.2 ? 'land' : W / H < 0.85 ? 'port' : 'square', tall = H / W > 1.5, u = Math.min(W, H) / 1080;
  // hero box (16:9) and the steps card, laid out per format
  const hw = fmt === 'land' ? W * 0.6 : W * 0.84, hh = hw * 9 / 16;
  const hero = $('#hero'); Object.assign(hero.style, { width: hw + 'px', height: hh + 'px', left: (W - hw) / 2 + 'px', top: (H - hh) / 2 + 'px' });
  $('#scan').style.background = `linear-gradient(${A2},${A})`; $('#scan').style.boxShadow = `0 0 24px 6px ${A}aa`;
  const fs = 34 * u, ic = 46 * u;
  $('#steps').style.padding = `${30 * u}px ${36 * u}px`;
  $('#steps').innerHTML = STEPS.map(s => `<div class="stp" style="font-size:${fs}px;height:${ic * 1.9}px"><div class="ic" style="width:${ic}px;height:${ic}px;margin-right:${22 * u}px">` +
    `<svg viewBox="0 0 46 46"><circle cx="23" cy="23" r="20" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="3"/><circle class="arc" cx="23" cy="23" r="20" fill="none" stroke="${A}" stroke-width="3" stroke-linecap="round" stroke-dasharray="40 200"/>` +
    `<path class="chk" d="M14 24l6 6 12-13" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="30" stroke-dashoffset="30"/></svg></div><span class="lb">${s}</span></div>`).join('');
  const sc = $('#steps'), sw = K.measure(sc).width, sh = K.measure(sc).height;
  // steps card position: right of the hero in 16:9, below it in 9:16 / 1:1
  const heroB = fmt === 'land' ? { x: W * 0.30, y: H / 2, s: 0.66 } : { x: W / 2, y: H * 0.34, s: 0.7 };
  const stepsP = fmt === 'land' ? { x: W * 0.60, y: H / 2 - sh / 2 } : { x: W / 2 - sw / 2, y: H * 0.34 + hh * 0.7 / 2 + 40 * u };
  sc.style.left = stepsP.x + 'px'; sc.style.top = stepsP.y + 'px';
  // tiles: 12 posts in 4:5, grid per format
  const [cols, rows] = fmt === 'land' ? [6, 2] : fmt === 'port' ? [3, 4] : [4, 3];
  const gap = 22 * u, tw = Math.min((W * 0.86 - gap * (cols - 1)) / cols, ((H * (fmt === 'land' ? 0.8 : 0.72)) - gap * (rows - 1)) / rows / 1.25), th = tw * 1.25;
  const gx = (W - (cols * tw + (cols - 1) * gap)) / 2, gy = (H - (rows * th + (rows - 1) * gap)) / 2 - (fmt === 'port' ? 40 * u : 0);
  const tiles = [...Array(cols * rows)].map((_, k) => { const d = document.createElement('div'); d.className = 'tile';
    Object.assign(d.style, { width: tw + 'px', height: th + 'px', left: gx + (k % cols) * (tw + gap) + 'px', top: gy + Math.floor(k / cols) * (th + gap) + 'px' });
    d.innerHTML = `<img src="${IMGS[k % IMGS.length]}" style="object-position:${[20, 50, 80][k % 3]}% 50%;filter:brightness(${1 + (k % 4) * 0.05}) saturate(${1 + (k % 3) * 0.15})"><div class="lg"></div>` +
      `<div class="cap"><i style="top:24%;width:70%"></i><i style="top:58%;width:44%"></i></div>`; $('#tiles').appendChild(d); return d; });
  const ex = $('#ex'); ex.style.fontSize = (20 * u) + 'px'; ex.style.right = (fmt === 'land' ? 104 : 72 * u) + 'px'; ex.style.bottom = (tall ? Math.round(680 * H / 1920) : 40 * u) + 'px';
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));

  window.render = t => {
    // 1 · thermal reveal (scan edge moves left -> right), slow hue drift on the thermal layer
    document.getElementById('hue').setAttribute('values', (t * 40).toFixed(1));
    const p = K.lerp(-15, 115, K.E.inOut(K.seg(t, BC.thermal, BC.thermal + 1.0)));
    $('#therm').style.webkitMaskImage = `linear-gradient(100deg, transparent ${p - 6}%, black ${p + 2}%)`;
    K.set('#scan', { x: hw * p / 100, o: p > 0 && p < 100 ? 1 : 0 });
    // 2 · the hero slides aside; steps card in; each label shimmers until its tick
    const m = K.E.inOut(K.seg(t, 1.35, 1.8)), out3 = K.E.in(K.seg(t, 2.45, 2.75));
    const hx = K.lerp(W / 2, heroB.x, m), hy = K.lerp(H / 2, heroB.y, m), hs = K.lerp(1, heroB.s, m) * (1 + 0.03 * K.seg(t, 0, 1.4)) * (1 + 0.25 * out3);
    K.set(hero, { x: hx - W / 2, y: hy - H / 2, s: hs, o: 1 - out3, blur: 10 * out3 });
    const si = K.E.out(K.seg(t, 1.55, 1.95));
    K.set(sc, { o: si * (1 - out3), x: (1 - si) * 60 * u, blur: (1 - si) * 8 + 10 * out3, s: 1 + 0.2 * out3 });
    sc.querySelectorAll('.stp').forEach((r, i) => { const done = t >= BC.steps[i], lb = r.querySelector('.lb');
      lb.style.backgroundImage = done ? 'linear-gradient(#fff,#fff)' : `linear-gradient(100deg,rgba(255,255,255,.35) 40%,#fff 50%,rgba(255,255,255,.35) 60%)`;
      lb.style.backgroundPosition = `${100 - ((t * 1.1 + i * 0.3) % 1) * 100}% 0`;
      r.querySelector('.arc').setAttribute('transform', `rotate(${t * 520 + i * 90} 23 23)`); r.querySelector('.arc').style.opacity = done ? 0 : 1;
      const c = K.seg(t, BC.steps[i], BC.steps[i] + 0.2); r.querySelector('.chk').setAttribute('stroke-dashoffset', 30 * (1 - c));
      r.querySelector('.ic').style.background = done ? A : 'transparent'; K.set(r.querySelector('.ic'), { s: done ? 1 + 0.25 * Math.exp(-(t - BC.steps[i]) / 0.08) : 1 }); });
    // 3 · cascade: tiles drop in tilted and blurred, staggered, and settle; a slow pull-back
    const c0 = BC.cascade;
    tiles.forEach((d, k) => { const a = c0 + 0.05 * (k % cols) + 0.08 * Math.floor(k / cols) + 0.02 * k, v = K.E.out(K.seg(t, a, a + 0.45), 3);
      K.set(d, { y: (1 - v) * -H * 0.5, r: (1 - v) * (k % 2 ? 14 : -12), s: (1 - v) * 0.5 + 1 - 0.04 * K.seg(t, c0, 4), blur: (1 - v) * 14, o: K.seg(t, a, a + 0.1) }); });
    ex.style.opacity = 0.9 * K.seg(t, c0 + 0.5, c0 + 0.8);
  };
  await document.fonts.ready; window.READY = true;
})();
</script></body></html>
