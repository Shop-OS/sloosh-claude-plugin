<!doctype html>
<!-- ui/type.html (saas-product-video): the film's type layer, rendered to a transparent PNG sequence:
       python3 lib/render_html.py ui/type.html --dur <LEN> --jobs 1 --out frames/type
     Lockups (SKILL.md, Type system): A Hype Stack, B Echo, C Slam, D End Card (logo + wordmark + serif line + CTA + URL + a cursor click).
     Sizes are exact per format (16:9 1920 / 9:16 1080 / 1:1 1080); every position is MEASURED after the fonts load;
     any line wider than the safe zone is auto-fitted. Copy, cue times and colours come from tl.json. -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Archivo';src:url('/fonts/archivo-latin-wdth-italic.woff2') format('woff2');font-style:italic;font-weight:100 900;font-stretch:62% 125%;font-display:block}
@font-face{font-family:'Inter Tight';src:url('/fonts/inter-tight-latin-wght-normal.woff2') format('woff2');font-weight:100 900;font-display:block}
@font-face{font-family:'Instrument Serif';src:url('/fonts/instrument-serif-latin-400-italic.woff2') format('woff2');font-style:italic;font-weight:400;font-display:block}
html,body{margin:0;background:transparent;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden}
.hype{font-family:'Archivo';font-style:italic;font-weight:900;font-stretch:125%;text-transform:uppercase;line-height:.86;letter-spacing:-.01em;white-space:nowrap}
.shadow{text-shadow:0 0 18px rgba(0,0,0,.6),0 4px 18px rgba(0,0,0,.6)}
.lockA{position:absolute}
.lockA .l{display:table}
.echo{position:absolute;left:0;right:0;text-align:center}
.echo .hero,.echo .ghost{display:block}
.echo .ghost{color:transparent}
.echo .small{display:block;letter-spacing:.42em;padding-left:.42em;font-style:normal;font-stretch:100%;font-weight:700}
.slam{position:absolute;left:0;right:0;text-align:center}
.end{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center}
.end .row{display:flex;align-items:center}
.end .word{font-family:'Inter Tight';font-weight:800;letter-spacing:-.02em;white-space:nowrap;color:#fff}
.end .line{font-family:'Instrument Serif';font-style:italic;color:#fff;opacity:.92;white-space:nowrap}
.end .btn{font-family:'Inter Tight';font-weight:700;border-radius:999px;color:#fff;white-space:nowrap}
.end .url{font-family:'Inter Tight';font-weight:600;letter-spacing:.32em;padding-left:.32em;text-transform:uppercase;color:#fff;opacity:.7}
#cur{position:absolute;left:0;top:0;transform-origin:0 0;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
#rip{position:absolute;left:0;top:0;border-radius:50%;opacity:0}
</style></head><body><div id="stage"></div>
<script src="/lib/kit.js"></script>
<script>
(async () => {
  const TL = await loadTL(), W = TL.W, H = TL.H, C = TL.COPY, T = TL.TYPE;
  await Promise.all(['italic 900 100px Archivo', '800 100px "Inter Tight"', 'italic 400 100px "Instrument Serif"'].map(f => document.fonts.load(f)));
  const st = document.getElementById('stage'); st.style.width = W + 'px'; st.style.height = H + 'px';
  const fmt = W / H > 1.2 ? 'land' : W / H < 0.85 ? 'port' : 'square', tall = H / W > 1.5;   // 9:16 and 4:5 are 'port'; only 9:16 is tall
  // exact px per format (SKILL.md, Type system)
  const P = {
    land:   { A1: 118, A2: 168, ax: 104, abot: H - 96,  echo: 280, small: 44, slam: 240, logo: 120, word: 104, line: 54, btn: 38, url: 26, sz: [104, W - 104] },
    port:   { A1: 118, A2: 168, ax: 120, abot: tall ? Math.round(1260 * H / 1920) : H - 96, echo: 260, small: 44, slam: 200, logo: 112, word: 96,  line: 52, btn: 40, url: 26, sz: [120, W - 120] },
    square: { A1: 96,  A2: 136, ax: 72,  abot: H - 84,  echo: 220, small: 38, slam: 190, logo: 104, word: 88,  line: 46, btn: 36, url: 24, sz: [72, W - 72] },
  }[fmt];
  const SW = P.sz[1] - P.sz[0];
  const el = (cls, html) => { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; st.appendChild(d); return d; };
  const fit = (span, max) => { const w = K.measure(span).width; if (w > max) span.style.fontSize = (parseFloat(span.style.fontSize) * max / w) + 'px'; };

  // A · Hype Stack: bottom-left of the safe zone, line 2 in the accent and larger, tucked up into line 1
  const lockA = {};
  for (const k of Object.keys(T).filter(k => k.startsWith('lockA'))) {
    const d = el('lockA hype shadow', `<span class="l" style="color:${TL.INK};font-size:${P.A1}px">${C[k][0]}</span><span class="l" style="color:${TL.ACCENT};font-size:${P.A2}px;margin-top:-0.13em">${C[k][1]}</span>`);
    const ls = [...d.querySelectorAll('.l')], widest = Math.max(...ls.map(l => K.measure(l).width));
    if (widest > SW * 0.96) ls.forEach(l => { l.style.fontSize = (parseFloat(l.style.fontSize) * SW * 0.96 / widest) + 'px'; });
    d.style.left = P.ax + 'px'; d.style.top = (P.abot - K.measure(d).height) + 'px'; lockA[k] = d;
  }
  // B · Echo: small tracked word above, a huge accent hero word at 42% of the height, 3 outlined copies cascading below
  let echo = null;
  if (T.echo) {
    echo = el('echo hype', `<span class="small" style="color:${TL.INK};font-size:${P.small}px">${C.echo[0]}</span><span class="hero" style="color:${TL.ACCENT};font-size:${P.echo}px">${C.echo[1]}</span>` +
      [0, 1, 2].map(() => `<span class="ghost" style="font-size:${P.echo}px;margin-top:${-0.27 * P.echo}px;-webkit-text-stroke:3px #fff">${C.echo[1]}</span>`).join(''));
    echo.querySelectorAll('.hero,.ghost').forEach(s => fit(s, SW));
    const hero = echo.querySelector('.hero'); echo.style.top = (H * 0.42 - (K.measure(hero).top - K.measure(echo).top) - K.measure(hero).height / 2) + 'px';
  }
  // C · Slam: one word per beat, centred at 40% of the height
  const slams = (C.slams || []).map(w => { const d = el('slam hype shadow', `<span style="color:${TL.INK};font-size:${P.slam}px">${w}</span>`);
    fit(d.firstChild, SW); d.style.top = (H * 0.40 - K.measure(d).height / 2) + 'px'; d.style.transformOrigin = '50% 50%'; return d; });
  // D · End card: logo + wordmark, a serif line, a CTA pill and the URL, centred; a cursor clicks the CTA
  let end = null, cur = null, rip = null;
  if (T.end) {
    const [word, line, btn, url] = C.end;
    end = el('end', `<div class="row"><img class="logo" src="/ui/logo.svg" style="width:${P.logo}px;height:${P.logo}px;margin-right:${P.logo * 0.28}px"><span class="word" style="font-size:${P.word}px">${word}</span></div>` +
      `<div class="line" style="font-size:${P.line}px;margin-top:${P.line * 0.6}px">${line}</div>` +
      `<div class="btn" style="font-size:${P.btn}px;padding:${P.btn * 0.62}px ${P.btn * 1.4}px;margin-top:${P.btn * 1.3}px;background:linear-gradient(100deg,${TL.ACCENT2},${TL.ACCENT});box-shadow:0 18px 44px ${TL.ACCENT}55">${btn}</div>` +
      `<div class="url" style="font-size:${P.url}px;margin-top:${P.url * 1.3}px">${url}</div>`);
    const wd = end.querySelector('.word'); wd.textContent = wd.textContent.replace(/ /g, '\u00a0');   // kit.js track() splits letters into inline-blocks: keep spaces as no-break spaces
    K.track(wd, 1e6, 0, 0.3, -0.02, 1.0);            // fit at the FINAL tracking
    const row = end.querySelector('.row'); if (K.measure(row).width > SW * 0.94) { const s = SW * 0.94 / K.measure(row).width; wd.style.fontSize = (P.word * s) + 'px'; end.querySelector('.logo').style.width = end.querySelector('.logo').style.height = (P.logo * s) + 'px'; }
    fit(end.querySelector('.line'), SW * 0.94);
    end.style.width = W + 'px'; end.style.top = (H * 0.5 - K.measure(end).height / 2) + 'px';
    cur = el('', `<svg id="cur" width="${P.btn * 1.25}" height="${P.btn * 1.25}" viewBox="0 0 24 24"><path d="M3 2l7.5 19 2.4-7.6L20.5 11z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg>`).firstChild;
    rip = el('', `<div id="rip" style="width:${P.btn * 4}px;height:${P.btn * 4}px;margin:${-P.btn * 2}px 0 0 ${-P.btn * 2}px;border:3px solid ${TL.ACCENT2}"></div>`).firstChild;
  }
  const show = (d, on) => { d.style.display = on ? '' : 'none'; return on; };

  window.render = t => {
    for (const [k, d] of Object.entries(lockA)) { const [a, b] = T[k]; if (show(d, t >= a - .01 && t < b + .26)) K.lockupA(d, t, a, b); }
    if (echo) { const [a, b] = T.echo; if (show(echo, t >= a - .01 && t < b + .3)) K.echo(echo, t, a, b); }
    slams.forEach((d, i) => { const a = T.slams[i], b = T.slams[i + 1] ?? (a + 2 * TL.B); if (show(d, t >= a && t < b)) K.slam(d, t, a, b - 0.08); });
    if (end) {
      const na = T.end[0], on = show(end, t >= na); show(cur, on); show(rip, on);
      if (on) {
        const g = K.E.back(K.seg(t, na, na + 0.45), 1.6);
        K.set(end.querySelector('.logo'), { s: 0.4 + 0.6 * g, r: (1 - g) * -14, o: K.seg(t, na, na + 0.15) });
        K.track(end.querySelector('.word'), t, na + 0.1, 0.3, -0.02, 1.0);
        K.set(end.querySelector('.line'), { o: K.seg(t, na + 0.45, na + 0.8), y: (1 - K.E.out(K.seg(t, na + 0.45, na + 0.9))) * 18, blur: (1 - K.seg(t, na + 0.45, na + 0.8)) * 10 });
        const tc = TL.END_CLICK ?? (na + 1.55), sq = 1 - 0.06 * Math.exp(-Math.pow((t - tc) / 0.07, 2));
        K.set(end.querySelector('.btn'), { o: K.seg(t, na + 0.6, na + 0.85), y: (1 - K.E.out(K.seg(t, na + 0.6, na + 1.0))) * 28, s: sq });
        K.set(end.querySelector('.url'), { o: 0.7 * K.seg(t, na + 0.8, na + 1.1) });
        // cursor: from below-right of the frame to the MEASURED centre of the button, click at tc
        const b = K.center(end.querySelector('.btn'));
        K.cursor(cur, { x: W * 0.86, y: H * 1.05 }, end.querySelector('.btn'), t, na + 0.9, tc - 0.08, tc);
        cur.style.opacity = K.seg(t, na + 0.9, na + 1.0) * (1 - K.seg(t, tc + 0.6, tc + 0.8));
        K.set(rip, { x: b.x, y: b.y, s: 0.2 + 0.8 * K.E.out(K.seg(t, tc, tc + 0.45)), o: t >= tc ? 0.8 * (1 - K.seg(t, tc, tc + 0.45)) : 0 });
      }
    }
  };
  await document.fonts.ready; window.READY = true;
})();
</script></body></html>
