<!doctype html>
<!-- ui/toggle.html: the before/after toggle over footage (transparent overlay; starts at tl.T_TOG, runs to tl.T_END):
       python3 lib/render_html.py ui/toggle.html --dur <T_END - T_TOG> --jobs 1 --out frames/toggle
     A slanted white pill (skewX -14deg) with a black glossy knob carrying the logo, "OFF" to its left, starts 2.5x big
     in the centre over the FLAT footage. The cursor flies in and clicks on tl.T_CLICK (the beat). ON: an accent
     gradient fill with a glow, the knob slides with an overshoot, two heavy italic lines slide in ("STUDIO / MODE").
     About 0.6 s later it shrinks into a bottom-left corner badge. Centred on the pill's MEASURED box while OFF and on
     pill + label once ON, so it never drifts off-centre. edit.py switches the footage from flat to graded on the
     same frame and puts the inverted frame on the click (tl.HITS). A small BEFORE tag sits top-left until the click. -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Archivo';src:url('/fonts/archivo-latin-wdth-italic.woff2') format('woff2');font-style:italic;font-weight:100 900;font-stretch:62% 125%;font-display:block}
@font-face{font-family:'Archivo';src:url('/fonts/archivo-latin-wdth-normal.woff2') format('woff2');font-style:normal;font-weight:100 900;font-stretch:62% 125%;font-display:block}
@font-face{font-family:'Inter Tight';src:url('/fonts/inter-tight-latin-wght-normal.woff2') format('woff2');font-weight:100 900;font-display:block}
html,body{margin:0;background:transparent;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden}
#grp{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;align-items:center}
#off{font-family:'Archivo';font-weight:800;font-stretch:125%;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.6);overflow:hidden;white-space:nowrap}
#pill{position:relative;border-radius:999px;transform:skewX(-14deg);background:#fff;box-shadow:0 18px 40px rgba(0,0,0,.45);overflow:hidden;flex:none}
#fill{position:absolute;inset:0;opacity:0}
#knob{position:absolute;top:50%;border-radius:50%;background:radial-gradient(110% 90% at 30% 20%,#4A4542,#0B0A09 60%);box-shadow:0 6px 16px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center}
#knob img{width:58%;height:58%;transform:skewX(14deg)}
#lab{font-family:'Archivo';font-style:italic;font-weight:900;font-stretch:125%;text-transform:uppercase;line-height:.88;color:#fff;white-space:nowrap;overflow:hidden;text-shadow:0 4px 18px rgba(0,0,0,.55)}
#lab span{display:block}
#tag{position:absolute;font-family:'Inter Tight';font-weight:700;letter-spacing:.24em;padding-left:.24em;text-transform:uppercase;border-radius:999px;color:#fff;white-space:nowrap}
#cur{position:absolute;left:0;top:0;transform-origin:0 0;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
</style></head><body><div id="stage">
<div id="tag"></div>
<div id="grp"><div id="off"></div><div id="pill"><div id="fill"></div><div id="knob"><img src="/ui/logo.svg"></div></div><div id="lab"></div></div>
<svg id="cur" viewBox="0 0 24 24"><path d="M3 2l7.5 19 2.4-7.6L20.5 11z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg>
</div>
<script src="/lib/kit.js"></script>
<script>
(async () => {
  const TL = await loadTL(), W = TL.W, H = TL.H, A = TL.ACCENT, A2 = TL.ACCENT2, [OFF, L1, L2] = TL.COPY.toggle;
  const T0 = TL.T_TOG, TC = TL.T_CLICK - T0, TE = TL.T_END - T0;            // page time: 0 = T_TOG
  await Promise.all(['italic 900 100px Archivo', '800 100px Archivo', '700 40px "Inter Tight"'].map(f => document.fonts.load(f)));
  const $ = s => document.querySelector(s), st = $('#stage'); st.style.width = W + 'px'; st.style.height = H + 'px';
  const fmt = W / H > 1.2 ? 'land' : W / H < 0.85 ? 'port' : 'square', tall = H / W > 1.5, u = Math.min(W, H) / 1080;
  // design size (the group is drawn at 1x, then scaled 2.5x while centred, 0.9x as the corner badge)
  const PW = 150 * u, PH = 64 * u, KS = 52 * u;
  Object.assign($('#pill').style, { width: PW + 'px', height: PH + 'px' }); Object.assign($('#knob').style, { width: KS + 'px', height: KS + 'px', marginTop: (-KS / 2) + 'px' });
  $('#fill').style.background = `linear-gradient(100deg,${A2},${A})`;
  const off = $('#off'); off.textContent = OFF; off.style.fontSize = (40 * u) + 'px'; off.style.marginRight = (14 * u) + 'px';
  const lab = $('#lab'); lab.innerHTML = `<span>${L1}</span><span style="color:${A2}">${L2}</span>`; lab.style.fontSize = (34 * u) + 'px'; lab.style.marginLeft = (16 * u) + 'px';
  const offN = K.measure(off).width, labN = K.measure(lab).width, offW = offN + 14 * u, labW = labN + 16 * u;   // natural widths; + the CSS margin once
  const tag = $('#tag'); tag.style.fontSize = (22 * u) + 'px'; tag.style.padding = `${10 * u}px ${18 * u}px`;
  const SZ = fmt === 'land' ? { l: 104, b: H - 96 } : fmt === 'port' ? { l: 120, b: tall ? Math.round(1260 * H / 1920) : H - 96 } : { l: 72, b: H - 84 };
  tag.style.left = SZ.l + 'px'; tag.style.top = (tall ? Math.round(260 * H / 1920) : fmt === 'port' ? 96 : 60 * u) + 'px';
  const cur = $('#cur'); cur.style.width = cur.style.height = (46 * u) + 'px';

  window.render = t => {
    const on = t >= TC, k = K.E.back(K.seg(t, TC, TC + 0.25), 2.2);           // knob slide with overshoot
    // label widths collapse/expand (kept wide enough that nothing clips: measured once, never guessed)
    const offV = 1 - K.E.inOut(K.seg(t, TC, TC + 0.18)), labV = K.E.out(K.seg(t, TC + 0.05, TC + 0.3));
    off.style.width = (offN * offV) + 'px'; off.style.opacity = offV; lab.style.width = (labN * labV) + 'px';
    K.set(lab, { x: (1 - labV) * -30 * u });
    $('#fill').style.opacity = on ? 1 : 0; $('#pill').style.boxShadow = on ? `0 18px 40px rgba(0,0,0,.45),0 0 ${40 * u}px ${A}` : '0 18px 40px rgba(0,0,0,.45)';
    $('#knob').style.left = (K.lerp(6 * u, PW - KS - 6 * u, Math.max(0, k))) + 'px';
    // centre: on the MEASURED pill while OFF, on pill + label once ON; then shrink to the bottom-left badge
    const g = $('#grp'); g.style.transform = 'none';
    const gw = K.measure(g).width, gh = K.measure(g).height, pr = K.measure('#pill');
    const anchorX = on ? gw / 2 : (pr.left - K.measure(g).left) + pr.width / 2;
    const big = Math.min(2.5, (W / 2 - SZ.l) / (offW + PW / 2), (W - 2 * SZ.l) / (14 * u + PW + labW)), sh = K.E.inOut(K.seg(t, TC + 0.6, TC + 1.0)), s = K.lerp(big, 0.75, sh);
    const cx = K.lerp(W / 2, SZ.l + gw * 0.75 / 2, sh), cy = K.lerp(H / 2, SZ.b - gh * 0.75 / 2, sh);
    const ax = K.lerp(anchorX, gw / 2, sh), intro = K.E.out(K.seg(t, 0.0, 0.3));
    g.style.transform = `translate(${cx - ax * s}px,${cy - gh / 2 * s}px) scale(${s * (0.85 + 0.15 * intro)})`;
    g.style.opacity = K.seg(t, 0, 0.12) * (1 - K.seg(t, TE - 0.15, TE));
    // BEFORE tag until the click, then a short AFTER tag in the accent
    tag.textContent = on ? 'After' : 'Before'; tag.style.background = on ? A : 'rgba(0,0,0,.45)';
    tag.style.opacity = on ? 1 - K.seg(t, TC + 0.6, TC + 0.8) : K.seg(t, 0.05, 0.2);
    // the cursor flies in from the bottom right and clicks the MEASURED knob on the beat
    const show = t >= 0.3 && t < TC + 0.5; cur.style.display = show ? '' : 'none';
    if (show) { K.cursor(cur, { x: W * 0.85, y: H * 1.05 }, '#knob', t, 0.35, TC - 0.08, TC); cur.style.opacity = 1 - K.seg(t, TC + 0.25, TC + 0.5); }
  };
  await document.fonts.ready; window.READY = true;
})();
</script></body></html>
