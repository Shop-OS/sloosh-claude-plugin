<!doctype html>
<!-- ui/shards.html (morph-shapeshift sub-preset GEOMETRIC SHARD WORLD, 7 s), a pure window.render(t).
       python3 lib/render_html.py ui/shards.html --dur 7 --opaque --out frames/shards --jobs 1
     24 seeded slate shards fly in from a ring 0.2-2.4 and tile a slab -> a warm light blade slices it 2.6 (2-frame
     key-colour flash 2.7) -> every shard folds into the traced logo's letters 3.2-4.3 (flubber, shard i -> letter i % n),
     shading unifies -> the layered logo resolves 4.4 -> slow pull-back to 7.0. Title comes from ui/type.html. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden;background:#0E1114}svg{position:absolute;left:0;top:0}</style></head><body>
<svg id="sv" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="vig" cx="50%" cy="45%" r="65%">
  <stop offset="0" stop-color="#3C4652" stop-opacity=".35"/><stop offset=".7" stop-color="#0E1114" stop-opacity="0"/></radialGradient>
  <linearGradient id="blade" x1="0" x2="1"><stop offset="0" stop-color="#F2B36B" stop-opacity="0"/><stop offset=".35" stop-color="#F2B36B"/>
  <stop offset=".5" stop-color="#fff"/><stop offset=".65" stop-color="#F2B36B"/><stop offset="1" stop-color="#F2B36B" stop-opacity="0"/></linearGradient></defs>
<rect width="100%" height="100%" fill="url(#vig)"/><g id="cam"><g id="sh"></g><g id="logo"></g><rect id="bl" height="4" fill="url(#blade)"/></g></svg>
<script src="/lib/kit.js"></script><script src="/vendor/flubber.min.js"></script><script src="/lib/morphkit.js"></script>
<script>
(async () => {
  const TL = await loadTL(), W = TL.W, H = TL.H, u = Math.min(W, H) / 1080, CX = W / 2, CY = H * 0.46, KEY = '#F2B36B';
  const SL = ['#3C4652', '#46515E', '#56616E', '#2F3842'], $ = id => document.getElementById(id), E = MK.E, S = K.seg, lerp = MK.lerp;
  const sv = $('sv'); sv.setAttribute('width', W); sv.setAttribute('height', H);
  const L = await MK.loadLogo('/ui/logo.json'), [bx, by, bw, bh] = L.bbox, size = Math.min(W * 0.6, H * 0.8 * bw / bh), k = size / Math.max(bw, bh);
  const P = MK.fitAll(L.layers[0].parts.map(p => p.ring), CX, CY, size);
  const slab = { x: CX - size / 2, y: CY - bh * k / 2 - 40 * u, w: size, h: bh * k + 80 * u };
  const T = MK.shards(slab, 6, 2, 9, 0.5), R = MK.rng(4), start = T.map(() => { const a = R() * Math.PI * 2, d = (700 + R() * 200) * u; return [Math.cos(a) * d, Math.sin(a) * d, (R() - 0.5) * 240]; });
  const F = T.map((tri, i) => MK.flub(tri, P[i % P.length]));
  $('sh').innerHTML = T.map(() => '<path stroke="#0E1114"/>').join('');
  $('logo').innerHTML = `<g transform="translate(${CX} ${CY}) scale(${k}) translate(${-(bx + bw / 2)} ${-(by + bh / 2)})">${MK.logoSVG(L)}</g>`;
  window.render = t => {
    const fold = E.expoInOut(S(t, 3.2, 4.3)), flash = t >= 2.7 && t < 2.7 + 2 / (TL.FPS || 30);
    [...$('sh').children].forEach((p, i) => { const a = E.expoOut(S(t, 0.2 + i * 0.035, 1.6 + i * 0.035)), [dx, dy, rot] = start[i];
      const c = T[i].reduce((s, q) => [s[0] + q[0] / 3, s[1] + q[1] / 3], [0, 0]);
      p.setAttribute('d', fold > 0 ? F[i](fold) : MK.d(T[i]));
      p.setAttribute('transform', `translate(${dx * (1 - a)} ${dy * (1 - a)}) rotate(${rot * (1 - a)} ${c[0]} ${c[1]})`);
      p.setAttribute('opacity', S(t, 0.2 + i * 0.035, 0.5 + i * 0.035) * (1 - S(t, 4.35, 4.6)));
      p.setAttribute('fill', flash ? KEY : MK.color(SL[i % 4], '#56616E', S(t, 3.5, 4.1)));
      p.setAttribute('stroke-width', 2 * (1 - S(t, 3.9, 4.3))); });
    const bu = E.p3InOut(S(t, 2.6, 2.85)); Object.entries({ x: 0, y: CY - 2, width: W * bu, opacity: 1 - S(t, 2.9, 3.2) }).forEach(([a, v]) => $('bl').setAttribute(a, v));
    $('logo').setAttribute('opacity', S(t, 4.3, 4.55));
    const z = lerp(1.06, 1.0, E.sine(S(t, 0, 7)));                                 // slow pull-back, never frozen
    $('cam').setAttribute('transform', `translate(${CX} ${CY}) scale(${z}) translate(${-CX} ${-CY})`);
  };
  window.READY = true;
})();
</script></body></html>
