name: Check generated files

# Every file in this repository is generated from Shop-OS/shopos-backend-ts
# (apps/spacelab-mcp/plugins). This check fails when a file differs from the build
# manifest, so a hand edit here is caught before it drifts from the source.
on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Compare the files with .sloosh-build.json
              run: |
                  node --input-type=module <<'EOF'
                  import { createHash } from "node:crypto";
                  import { execFileSync } from "node:child_process";
                  import { readFileSync } from "node:fs";

                  const manifestPath = ".sloosh-build.json";
                  const { files } = JSON.parse(readFileSync(manifestPath, "utf8"));
                  const entries = execFileSync("git", ["ls-files", "-s", "-z"], { encoding: "utf8" })
                      .split("\0")
                      .filter(Boolean)
                      .map((line) => {
                          const [meta, path] = line.split("\t");
                          return { mode: meta.split(" ")[0], path };
                      })
                      .filter((entry) => entry.path !== manifestPath);
                  const problems = [];
                  for (const { mode, path } of entries) {
                      if (mode !== "100644") problems.push(`${path}: mode ${mode}, expected 100644`);
                      const expected = files[path];
                      if (!expected) {
                          problems.push(`${path}: not in the build manifest`);
                          continue;
                      }
                      const actual = createHash("sha256").update(readFileSync(path)).digest("hex");
                      if (actual !== expected) problems.push(`${path}: differs from the build`);
                  }
                  const tracked = new Set(entries.map((entry) => entry.path));
                  for (const path of Object.keys(files)) {
                      if (!tracked.has(path)) problems.push(`${path}: missing`);
                  }
                  if (problems.length > 0) {
                      console.error(problems.join("\n"));
                      console.error(
                          "Change the source in Shop-OS/shopos-backend-ts apps/spacelab-mcp/plugins and sync again.",
                      );
                      process.exit(1);
                  }
                  console.log(`${entries.length} files match the build manifest.`);
                  EOF
